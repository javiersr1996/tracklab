version: 2

sources:
  - name: bronze_basketball
    description: >
      The basketball bundle in Parquet, native names and native rows, as
      `tracklab bronze basketball` wrote it. One file per match and table
      (`<table>/<match_id>.parquet`), except the season tables, which are a
      single `data.parquet`; `*.parquet` reads either shape.
    meta:
      external_location: "{{ env_var('TRACKLAB_DATA_ROOT', 'data') }}/bronze/basketball/{name}/*.parquet"
    tables:
      - name: matches
        description: One row per match of the ACB season bundle; the only place with the score.
      - name: game_players
        description: One row per player and match, both benches included.
      - name: player_id_aliases
        description: >
          Season table. 18 rows, 9 of which map a duplicated player id onto its
          canonical one. It never rewrites an id in silver (decision 4): it fills
          dim_entity.canonical_player_id and gold applies it.
      - name: tracking_frames
        description: >
          One row per frame, timeouts included. dim_period reads its period
          boundaries from here because game_data.json does not publish them.
      - name: tracking_objects
        description: >
          One row per frame and object, the ball included as a side of its own.
          A timeout frame has no row here at all, which is why `frames` loses
          about 44% of the basketball file and keeps the timeline in bronze.
      - name: events_chance_players
      - name: events_chances
      - name: events_closeouts
      - name: events_dribbles
      - name: events_drives
      - name: events_fouls
      - name: events_free_throws
        description: >
          Conformed as `shot`; native_family keeps them apart from open play.
      - name: events_handoffs
      - name: events_isolations
      - name: events_matchups
      - name: events_off_ball_screens
      - name: events_passes
        description: >
          A family of its own here; football has no equivalent event and marks a pass on how a player_possession ended.
      - name: events_picks
      - name: events_possessions
        description: >
          The native team possession, and the carrier of `leftHoop`: every other family rotates its coordinates by the one its `possessionId` points at.
      - name: events_posts
      - name: events_rebounds
      - name: events_shots
        description: >
          `location` is where the provider says the shot happened, not where the shooter stood at `startFrame` (task 9).
      - name: events_timeouts
      - name: events_touches
        description: >
          One player holding the ball. Conformed as `player_possession`.
      - name: events_turnovers
      - name: aggregates_drives
        description: >
          Season table, one row per player and team of ACB 2025-2026; traded players also carry a `team_name = 'total'` row with a null `team_id`.
      - name: aggregates_picks
        description: >
          Season table, one row per player and team of ACB 2025-2026; traded players also carry a `team_name = 'total'` row with a null `team_id`.
      - name: aggregates_shots
        description: >
          Season table, one row per player and team of ACB 2025-2026; traded players also carry a `team_name = 'total'` row with a null `team_id`.
