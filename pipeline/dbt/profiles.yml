# Paths are relative to the process working directory, which is pipeline/ for
# every command in tasks/todo.md. TRACKLAB_DATA_ROOT moves the database and the
# silver tree together, which is how CI builds on the fixtures (task 14).
tracklab:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('TRACKLAB_DATA_ROOT', 'data') }}/tracklab.duckdb"
      threads: 4
      plugins:
        # Creates one output directory per silver model before dbt copies into it.
        # DuckDB will not create it and dbt cannot; see src/tracklab/silver/dbt_plugin.py.
        # The root is an env var and not a dbt var because a plugin cannot read dbt vars,
        # and dbt_project.yml reads the same one when it writes each model's `location`.
        - module: tracklab.silver.dbt_plugin
          config:
            silver_dir: "{{ env_var('TRACKLAB_DATA_ROOT', 'data') }}/silver"
            models_dir: "{{ env_var('TRACKLAB_SILVER_MODELS', 'dbt/models/silver') }}"
            gold_dir: "{{ env_var('TRACKLAB_DATA_ROOT', 'data') }}/gold"
            gold_models_dir: "{{ env_var('TRACKLAB_GOLD_MODELS', 'dbt/models/gold') }}"
