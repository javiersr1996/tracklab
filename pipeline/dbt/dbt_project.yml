name: tracklab
version: 0.1.0
config-version: 2
profile: tracklab

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

require-dbt-version: [">=1.12.0", "<2.0.0"]

# Where silver lands on disk. The naming convention of tasks/todo.md is
# data/silver/<table>/data.parquet, one directory per table, so every model
# names its own file: dbt-duckdb's default (<external_root>/<name>.parquet)
# does not produce that layout. The root is the env var TRACKLAB_DATA_ROOT and
# not a dbt var because the plugin that creates those directories reads it too,
# and a plugin cannot see dbt vars. The CLI, the sources and the profile read the
# same variable, so one switch moves the whole pipeline onto the fixtures.
models:
  tracklab:
    silver:
      +materialized: external
      +format: parquet
      +tags: ["silver"]
      dim_sport:
        +location: "{{ env_var('TRACKLAB_DATA_ROOT', 'data') }}/silver/dim_sport/data.parquet"
        +tags: ["dims"]
      dim_match:
        +location: "{{ env_var('TRACKLAB_DATA_ROOT', 'data') }}/silver/dim_match/data.parquet"
        +tags: ["dims"]
      dim_period:
        +location: "{{ env_var('TRACKLAB_DATA_ROOT', 'data') }}/silver/dim_period/data.parquet"
        +tags: ["dims"]
      dim_team:
        +location: "{{ env_var('TRACKLAB_DATA_ROOT', 'data') }}/silver/dim_team/data.parquet"
        +tags: ["dims"]
      dim_team_period:
        +location: "{{ env_var('TRACKLAB_DATA_ROOT', 'data') }}/silver/dim_team_period/data.parquet"
        +tags: ["dims"]
      dim_entity:
        +location: "{{ env_var('TRACKLAB_DATA_ROOT', 'data') }}/silver/dim_entity/data.parquet"
        +tags: ["dims"]
      # `frames` is partitioned, so its location is the directory and DuckDB names
      # the file inside each partition. A silver match_id carries a colon
      # (`bb:114086`), which is not a legal directory name on Windows and gets
      # percent-escaped, so the partition is the native id and the prefixed key
      # stays a column of the file.
      frames:
        +location: "{{ env_var('TRACKLAB_DATA_ROOT', 'data') }}/silver/frames"
        +tags: ["facts"]
      events:
        +location: "{{ env_var('TRACKLAB_DATA_ROOT', 'data') }}/silver/events"
        +tags: ["facts"]
      # Views are computed on demand and write no file, so they need no location
      # and no directory of their own.
      views:
        +materialized: view
        +tags: ["views"]
    # Gold: the six season aggregates as wide models, and the dimensional shape of
    # the same data. One file per model under data/gold/<table>/, like silver.
    gold:
      +materialized: external
      +format: parquet
      +tags: ["gold"]
      agg_bb_shots:
        +location: "{{ env_var('TRACKLAB_DATA_ROOT', 'data') }}/gold/agg_bb_shots/data.parquet"
      agg_bb_drives:
        +location: "{{ env_var('TRACKLAB_DATA_ROOT', 'data') }}/gold/agg_bb_drives/data.parquet"
      agg_bb_picks:
        +location: "{{ env_var('TRACKLAB_DATA_ROOT', 'data') }}/gold/agg_bb_picks/data.parquet"
      agg_fb_obr:
        +location: "{{ env_var('TRACKLAB_DATA_ROOT', 'data') }}/gold/agg_fb_obr/data.parquet"
      agg_fb_passing:
        +location: "{{ env_var('TRACKLAB_DATA_ROOT', 'data') }}/gold/agg_fb_passing/data.parquet"
      agg_fb_physical:
        +location: "{{ env_var('TRACKLAB_DATA_ROOT', 'data') }}/gold/agg_fb_physical/data.parquet"
      dim_player:
        +location: "{{ env_var('TRACKLAB_DATA_ROOT', 'data') }}/gold/dim_player/data.parquet"
      dim_season_team:
        +location: "{{ env_var('TRACKLAB_DATA_ROOT', 'data') }}/gold/dim_season_team/data.parquet"
      dim_metric:
        +location: "{{ env_var('TRACKLAB_DATA_ROOT', 'data') }}/gold/dim_metric/data.parquet"
      fact_player_season_metric:
        +location: "{{ env_var('TRACKLAB_DATA_ROOT', 'data') }}/gold/fact_player_season_metric/data.parquet"

seeds:
  tracklab:
    +tags: ["dims"]
    surface_spec:
      +column_types:
        surface_spec: VARCHAR
        length_m: DOUBLE
        width_m: DOUBLE
        source: VARCHAR
