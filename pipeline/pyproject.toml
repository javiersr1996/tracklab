[project]
name = "tracklab"
version = "0.1.0"
description = "Bronze-to-publish data pipeline for basketball and football tracking data."
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "dbt-duckdb>=1.8",
    "dagster>=1.8",
    "dagster-dbt>=0.26",
    "httpx>=0.27",
    "psycopg[binary]==3.3.6",
]

[project.scripts]
tracklab = "tracklab.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracklab"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true  # pyarrow ships no stubs and no py.typed marker
