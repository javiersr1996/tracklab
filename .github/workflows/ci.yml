# Every push and pull request: lint, types, and the whole silver and gold build with their
# dbt tests, on the bronze slice versioned in pipeline/tests/fixtures (task 14).
# The contract tests read pipeline/data, which CI does not have, so they skip
# here and run in full-build.yml against the real bundles. The Postgres load of
# task 44 runs against a service container, never against Neon.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    # The Postgres of task 44's loader: the minor of 17 that Neon runs. The password changes with
    # every run and the container lives as long as the job; it guards nothing worth a secret.
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TRACKLAB_DATA_ROOT: tests/fixtures/data
      PGPASSWORD: ci-${{ github.run_id }}
      TRACKLAB_PG_DSN: host=localhost port=5432 user=postgres dbname=postgres
      # The Postgres tests create and drop their own databases here, and fail instead of
      # skipping when the variable is missing.
      TRACKLAB_TEST_PG_DSN: host=localhost port=5432 user=postgres dbname=postgres
      TRACKLAB_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      # silver through `tracklab build` (task 32), so the same recorded run that CI checks
      # against `lineage.json` also builds the asset graph (task 15) on every push.
      # `*` would ingest and rebuild bronze over the fixture slice: silver and gold are what hang from it.
      # The record goes to $TRACKLAB_DATA_ROOT/build: a record under pipeline/data/ would flip
      # the contract tests' "no real bundle" skip (tests/publish/) and fail them against the
      # fixture-only rows (found by reproducing this job locally).
      - run: uv run dbt parse --project-dir dbt --profiles-dir dbt
      - run: uv run tracklab build --select "group:silver or group:gold"
      - run: uv run tracklab publish lineage --check
      # Task 44 by hand, as Javier will run it against Neon: two loads of the same gold (the
      # second prints inserted=0 updated=0 deleted=0) and the snapshot, to a scratch directory.
      # The tests below assert all of it.
      - run: uv run tracklab load postgres
      - run: uv run tracklab load postgres
      - run: |
          cp ../web/public/data/warehouse_examples.json "$RUNNER_TEMP/"
          uv run tracklab publish warehouse-pg --where ci --out-dir "$RUNNER_TEMP"
      - run: uv run pytest -q -rs

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Screenshots are for looking at, not assertions (task 21).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: web/test-results/
