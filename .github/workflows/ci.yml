# Every push and pull request: lint, types, and the whole silver build with its
# dbt tests, on the bronze slice versioned in pipeline/tests/fixtures (task 14).
# The contract tests read pipeline/data, which CI does not have, so they skip
# here and run in full-build.yml against the real bundles.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    env:
      TRACKLAB_DATA_ROOT: tests/fixtures/data
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      # silver through Dagster, so the asset graph (task 15) is built on every push.
      # `*` would ingest and rebuild bronze over the fixture slice: silver is what hangs from it.
      - run: uv run dbt parse --project-dir dbt --profiles-dir dbt
      - run: uv run dagster asset materialize -m tracklab.dagster_defs --select "group:silver"
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Screenshots are for looking at, not assertions (task 21).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: web/test-results/
