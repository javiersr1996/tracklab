# Every push and pull request: lint, types, and the whole silver and gold build with their
# dbt tests, on the bronze slice versioned in pipeline/tests/fixtures (task 14).
# The contract tests read pipeline/data, which CI does not have, so they skip
# here and run in full-build.yml against the real bundles. The Postgres load of
# task 44 runs against a service container, never against Neon.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    # The Postgres of task 44's loader: the minor of 17 that Neon runs. The password changes with
    # every run and the container lives as long as the job; it guards nothing worth a secret.
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TRACKLAB_DATA_ROOT: tests/fixtures/data
      PGPASSWORD: ci-${{ github.run_id }}
      TRACKLAB_PG_DSN: host=localhost port=5432 user=postgres dbname=postgres
      # The Postgres tests create and drop their own databases here, and fail instead of
      # skipping when the variable is missing.
      TRACKLAB_TEST_PG_DSN: host=localhost port=5432 user=postgres dbname=postgres
      TRACKLAB_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      # silver through `tracklab build` (task 32), so the same recorded run that CI checks
      # against `lineage.json` also builds the asset graph (task 15) on every push.
      # `*` would ingest and rebuild bronze over the fixture slice: silver and gold are what hang from it.
      # The record goes to $TRACKLAB_DATA_ROOT/build: a record under pipeline/data/ would flip
      # the contract tests' "no real bundle" skip (tests/publish/) and fail them against the
      # fixture-only rows (found by reproducing this job locally).
      - run: uv run dbt parse --project-dir dbt --profiles-dir dbt
      - run: uv run tracklab build --select "group:silver or group:gold"
      - run: uv run tracklab publish lineage --check
      # Task 82: lesson 1's public SQL. The fixtures hold no basketball raw, so it prints PARTIAL
      # 0/10 and what it verified (the SQL names its match id twice, quality.json holds ten
      # matches); the synthetic match that runs the SQL is in the pytest below, and full-build.yml
      # runs it over the ten real matches (FULL 10/10) against web/public/data/quality.json.
      - run: uv run tracklab learn gravity --check
      - run: uv run tracklab learn speed --check
      - run: uv run tracklab learn rebound --check
      - run: uv run tracklab learn clock --check
      # Task 54: P5's versioned reports and runs.json against the fixtures. A slice of the
      # warehouse cannot recompute the figures, so each prints PARTIAL and what it verified
      # (the seal, the protocol, the match list, the clips by size and hash); full-build.yml
      # recomputes them on the whole warehouse. The synthetic P5 tests are in the pytest below.
      - run: uv run tracklab runs protocol --check
      - run: uv run tracklab runs coverage --check
      - run: uv run tracklab runs probe --check
      - run: uv run tracklab runs effect --check
      - run: uv run tracklab publish runs --check
      # Task 46: the committed Parquet and example answers are what gold writes, on Linux too
      # (the fixtures carry the six season aggregates whole, so the bytes are the real ones).
      - run: uv run tracklab publish warehouse --check
      - run: uv run tracklab publish examples --check
      # Task 60: the synthetic sweep reads no data, so CI regenerates all of it and compares
      # the bytes of reports/pose_sweep.json (about 1.5 minutes).
      - run: uv run tracklab pose sweep --check
      # Task 60, phase B2: the protocol against the code; the fixtures hold a slice of 1925299,
      # so the denominators travel as written and it prints PARTIAL 0/2.
      - run: uv run tracklab pose protocol --check
      # The probe's first time recomputes only on a whole 1925299 (about 20 minutes); on the
      # fixtures it checks the seal, the protocol and the rule as written (PARTIAL 0/1).
      - run: uv run tracklab pose probe --check
      # Task 64: the rest of P6 against the fixtures. Each says PARTIAL and what it verified (the
      # seal, the protocol, the code tree, the verdict; the clips and pose.json by schema, size,
      # sha256 and against the reports); full-build.yml recomputes them on the whole bronze
      # (FULL). The synthetic tests of the estimator, the criteria and the publication run in the
      # pytest below, and one runs every check with a data root that holds nothing.
      - run: uv run tracklab pose coverage --check
      - run: uv run tracklab pose metric --check
      - run: uv run tracklab publish pose --check
      # Task 44 by hand, as Javier will run it against Neon: two loads of the same gold (the
      # second prints inserted=0 updated=0 deleted=0) and the snapshot, to a scratch directory.
      # The tests below assert all of it.
      - run: uv run tracklab load postgres
      - run: uv run tracklab load postgres
      - run: |
          cp ../web/public/data/warehouse_examples.json "$RUNNER_TEMP/"
          uv run tracklab publish warehouse-pg --where ci --out-dir "$RUNNER_TEMP"
      - run: uv run pytest -q -rs

  web:
    runs-on: ubuntu-latest
    # 20, not 15: a slow `playwright install` (690 s once) left the job 36 s short of 15 min, and
    # task 45 adds about 40 s (service container, route tests, three more e2e). Task 46 caches
    # the browser, so the install no longer varies on a cache hit; the 20 stays for a miss.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    # Task 45: the route of /warehouse is tested against a real Postgres, as the read-only role.
    # Only the migrations of task 44 go in (psql below, no pipeline): the route tests check that the
    # five queries run as that role and return their columns, not their rows, which the
    # pipeline job and the local run against the real gold cover. The e2e needs no database.
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    # The read-only role's password, like the server's, is ci-<run id>. It goes in PGPASSWORD, which
    # `pg` reads when the URL carries none, so no connection string here holds a password
    # (review V of P4, B6; `tests/warehouse-pg-secret.test.ts` looks for one in every file).
    env:
      PGPASSWORD: ci-${{ github.run_id }}
      TRACKLAB_TEST_WEB_PG_URL: postgresql://warehouse_reader@localhost:5432/postgres
      # The owner's login, for the test that checks no lock outlives a request (review V of P4, S5).
      TRACKLAB_TEST_WEB_PG_ADMIN_URL: postgresql://postgres@localhost:5432/postgres
      TRACKLAB_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Schema and read-only login for the route tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: postgres
          PGPASSWORD: ci-${{ github.run_id }}
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE SCHEMA warehouse"
          for migration in ../pipeline/sql/[0-9][0-9][0-9]_*.sql; do psql -v ON_ERROR_STOP=1 -f "$migration"; done
          psql -v ON_ERROR_STOP=1 -c "ALTER ROLE warehouse_reader WITH LOGIN PASSWORD 'ci-${{ github.run_id }}'"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # The tests ran before the build, so this one reads the bundle it made (task 45).
      - run: npx vitest run tests/warehouse-pg-secret.test.ts
      # The browser download is what took from 26 s to 690 s. Cached by Playwright's own version;
      # the system libraries are not cached (they live outside ~/.cache), so a hit still runs
      # `install-deps`.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run e2e
      # Screenshots are for looking at, not assertions (task 21).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: web/test-results/
